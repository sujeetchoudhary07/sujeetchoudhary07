<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="170" viewBox="0 0 940 170" role="img" aria-labelledby="title">
  <title id="title">Animated snake moving across SuJeet's GitHub contribution grid</title>
  <defs>
    <pattern id="cells" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" rx="2" fill="#161b22" />
    </pattern>
  </defs>
  <text x="99" y="23" fill="#8b949e" font-family="sans-serif" font-size="12">CONTRIBUTIONS</text>
  <rect x="99" y="38" width="742" height="98" fill="url(#cells)" />
  <rect x="827" y="38" width="10" height="10" rx="2" fill="#39d353" />
  <path id="snake-route" d="M104 43 H832 V57 H104 V71 H832 V85 H104 V99 H832 V113 H104 V127 H832" fill="none" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="28 5200" opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="0" to="-5180" dur="38s" repeatCount="indefinite" />
  </path>
  <circle r="4" fill="#8B5CF6">
    <animateMotion dur="38s" repeatCount="indefinite">
      <mpath xlink:href="#snake-route" />
    </animateMotion>
  </circle>
  <text x="99" y="158" fill="#8b949e" font-family="sans-serif" font-size="11">2025</text>
  <text x="197" y="158" fill="#8b949e" font-family="sans-serif" font-size="11">2026</text>
</svg>
