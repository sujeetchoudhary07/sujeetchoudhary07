<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-labelledby="title desc">
<title id="title">Keep building. Keep learning.</title><desc id="desc">An animated indigo and cyan wave with a development motto.</desc>
<defs>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0a1530"/><stop offset="1" stop-color="#171a43"/></linearGradient>
<linearGradient id="wave" x1="0" x2="1"><stop stop-color="#8c69ff"/><stop offset="1" stop-color="#59ddfa"/></linearGradient>
<clipPath id="clip"><rect width="1200" height="140" rx="18"/></clipPath>
<style><![CDATA[
 .w1 {animation: wave 9s ease-in-out infinite alternate} .w2 {animation: wave 13s ease-in-out infinite alternate-reverse}
 .star {animation: blink 3s ease-in-out infinite}
 @keyframes wave {to {transform:translateX(-32px)}} @keyframes blink {50% {opacity:.15}}
 @media (prefers-reduced-motion: reduce){*{animation:none!important}}
]]></style>
</defs><g clip-path="url(#clip)"><rect width="1200" height="140" fill="url(#bg)"/>
<g opacity=".3"><path class="w1" d="M-50 96Q125 53 300 96T650 96T1000 96T1350 96" fill="none" stroke="url(#wave)" stroke-width="2"/><path class="w2" d="M-40 111Q145 70 330 111T700 111T1070 111T1440 111" fill="none" stroke="#79b4ff" stroke-width="2"/></g>
<circle cx="170" cy="37" r="3" fill="#5bdcc8" class="star"/><circle cx="1040" cy="35" r="3" fill="#987bff" class="star"/>
<text x="600" y="67" text-anchor="middle" fill="#f0f3ff" font-size="24" font-weight="700" font-family="'Segoe UI',Arial,sans-serif">Keep building. Keep learning.</text>
<text x="600" y="96" text-anchor="middle" fill="#9aadd5" font-size="15" font-family="'Segoe UI',Arial,sans-serif">Made with curiosity, code and a little creativity ✦</text>
</g></svg>