name: Update 3D GitHub Profile Animations

on:
  # GitHub Actions cron uses UTC. Approx. 03:00 IST = 21:30 UTC (previous date).
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-profile-animations
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Build animated 3D GitHub contributions
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Build light and dark snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/github-snake.svg?palette=github-light&color_snake=%233B82F6
            assets/github-snake-dark.svg?palette=github-dark&color_snake=%238B5CF6

      - name: Commit generated graphics if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/ assets/github-snake.svg assets/github-snake-dark.svg
          if git diff --cached --quiet; then
            echo "Contribution images are already up to date."
          else
            git commit -m "chore(profile): refresh animated contribution visuals [skip ci]"
            git push
          fi
